name: Build TapasTorch.apk (iOS Slider)

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & sign TapasTorch.apk (no Gradle needed!)
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          BT=$(ls -d "$SDK/build-tools/"* | sort -V | tail -n 1)
          PLAT=$(ls -d "$SDK/platforms/android-"* | sort -V | tail -n 1)
          echo "Using build-tools=$BT platform=$PLAT"

          mkdir -p build/gen build/obj build/dex

          "$BT/aapt2" compile --dir app/res -o build/res.zip
          "$BT/aapt2" link -o build/unsigned.apk \
            -I "$PLAT/android.jar" \
            --manifest app/AndroidManifest.xml \
            --java build/gen \
            build/res.zip

          javac -source 11 -target 11 -classpath "$PLAT/android.jar" \
            -d build/obj \
            $(find app/src build/gen -name '*.java')

          "$BT/d8" --lib "$PLAT/android.jar" --min-api 29 --output build/dex \
            $(find build/obj -name '*.class')

          cd build/dex && zip -u ../unsigned.apk classes.dex && cd ../..
          "$BT/zipalign" -f 4 build/unsigned.apk build/aligned.apk

          keytool -genkeypair -keystore build/debug.keystore \
            -storepass android -keypass android -alias tapas \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=TapasTorch,O=Kostya"

          "$BT/apksigner" sign --ks build/debug.keystore \
            --ks-pass pass:android --key-pass pass:android \
            --out TapasTorch.apk build/aligned.apk

          ls -lh TapasTorch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TapasTorch-apk
          path: TapasTorch.apk
